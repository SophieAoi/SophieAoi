name: Generate contribution graph

on:
  schedule:
    - cron: "0 2 * * *"   # daily, 02:00 UTC
  workflow_dispatch:       # lets you run it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Render contribution graph as SVG
        uses: Platane/snk@v3
        with:
          github_user_name: SophieAoi
          outputs: |
            dist/contribution-graph.svg?palette=github-dark&color_snake=#3E8FD6&color_dots=#020A18,#0B2A4A,#1D5285,#2E6FA8,#3E8FD6

      - name: Commit the result
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
