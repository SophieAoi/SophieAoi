<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="1000" height="210" role="img" aria-label="Sophie Aoi - Computer Science with Artificial Intelligence" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- PALETTE: base colour #111C52 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#080D2B"/>
      <stop offset="50%"  stop-color="#111C52"/>
      <stop offset="100%" stop-color="#1E2E7E"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#8DA2FB" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8DA2FB" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#2A3E9E" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3B52C4" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="210" fill="url(#bg)"/>
  <rect x="560" width="440" height="210" fill="url(#glow)"/>

  <text x="70" y="92" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace"
        font-size="42" font-weight="700" fill="#F2F4FF" letter-spacing="0">Sophie Aoi</text>

  <rect x="70" y="113" width="240" height="2" fill="url(#rule)"/>

  <text x="70" y="146" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace"
        font-size="16" fill="#8DA2FB" letter-spacing="1.5">Computer Science with Artificial Intelligence</text>

  <text x="70" y="174" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace"
        font-size="13" fill="#9AA3D0" letter-spacing="1.5">Image Processing &#8212; Machine Learning &#8212; Agentic AI</text>
</svg>
