<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="1000" height="230" role="img" aria-label="Sophie Aoi - Computer Science with Artificial Intelligence" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020A18"/>
      <stop offset="55%" stop-color="#061A33"/>
      <stop offset="100%" stop-color="#0B2A4A"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3E8FD6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3E8FD6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#3E8FD6" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="230" fill="url(#bg)"/>
  <rect width="1000" height="230" fill="url(#grid)"/>

  <g opacity="0.5">
    <circle cx="800" cy="70"  r="3" fill="#3E8FD6"/>
    <circle cx="880" cy="120" r="3" fill="#5EA9E0"/>
    <circle cx="790" cy="160" r="3" fill="#3E8FD6"/>
    <circle cx="915" cy="60"  r="3" fill="#3E8FD6"/>
    <circle cx="860" cy="185" r="3" fill="#5EA9E0"/>
    <circle cx="935" cy="140" r="3" fill="#3E8FD6"/>
    <g stroke="#3E8FD6" stroke-opacity="0.35" stroke-width="1">
      <line x1="800" y1="70"  x2="880" y2="120"/>
      <line x1="880" y1="120" x2="790" y2="160"/>
      <line x1="880" y1="120" x2="935" y2="140"/>
      <line x1="800" y1="70"  x2="915" y2="60"/>
      <line x1="915" y1="60"  x2="935" y2="140"/>
      <line x1="790" y1="160" x2="860" y2="185"/>
      <line x1="860" y1="185" x2="935" y2="140"/>
    </g>
  </g>

  <text x="70" y="100" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="46" font-weight="600" fill="#F1F6FB" letter-spacing="1">Sophie Aoi</text>
  <rect x="70" y="120" width="220" height="2" fill="url(#rule)"/>
  <text x="70" y="153" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" fill="#5EA9E0" letter-spacing="0.5">Computer Science with Artificial Intelligence</text>
  <text x="70" y="181" font-family="Consolas, Menlo, monospace" font-size="14" fill="#7F94AC" letter-spacing="0.5">image processing &#183; machine learning &#183; agentic AI</text>
</svg>
